<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        #rvmplayer { width: 100%; height: 100%; }
        .loading { 
            color: #00ff00; font-family: 'Courier New', Courier, monospace; 
            text-align: center; padding-top: 20%; 
            text-shadow: 0 0 10px #00ff00;
        }
        .debug-log {
            position: fixed; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.7); color: #0f0; 
            padding: 5px; font-size: 10px; z-index: 9999;
            pointer-events: none; border-radius: 4px;
            font-family: monospace; display: none;
        }
    </style>
    <script src="https://cdn.rvmplayer.org/rvmplayer.cpc6128.min.js"></script>

    <!-- DEV MODE: Disable caching for easier mobile testing. Remove these 3 lines for production -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div id="rvmplayer">
        <div class="loading" id="loader">LOADING SYSTEM...</div>
    </div>
    <div id="debug-log" class="debug-log"></div>

    <script>
        function showDebug(msg) {
            const el = document.getElementById('debug-log');
            if (el) {
                el.innerText = msg;
                el.style.display = 'block';
                // Hide after 2 seconds
                clearTimeout(window.debugTimeout);
                window.debugTimeout = setTimeout(() => { el.style.display = 'none'; }, 2000);
            }
        }

        // Get language from URL: ?lang=xx
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'en';

        // Load the localized disk script
        const script = document.createElement('script');
        script.src = `assets/disks/disk_${lang}.js`;
        script.onload = () => {
            initEmulator();
        };
        script.onerror = () => {
            document.getElementById('rvmplayer').innerHTML = `<div class="loading" style="color:red">ERROR: DISK NOT FOUND (${lang.toUpperCase()})</div>`;
        };
        document.head.appendChild(script);

        function initEmulator() {
            const container = document.getElementById('rvmplayer');
            if (typeof rvmPlayer_cpc6128 === 'function' && window.diskData) {
                container.innerHTML = '';
                window.emulator = rvmPlayer_cpc6128(container, {
                    disk: {
                        type: 'dsk',
                        url: 'data:application/octet-stream;base64,' + window.diskData
                    },
                    command: 'run"disc"\n',
                    warpFrames: 1000,
                    videoMode: 'tv',
                    pause: false, // Don't pause on start if we are in the iframe
                    video: true
                });
            } else {
                container.innerHTML = `<div class="loading" style="color:red">ERROR: EMULATOR NOT READY</div>`;
            }
        }

        // Listen for keys from the parent window (via postMessage)
        window.addEventListener('message', (event) => {
            if (event.data && (event.data.type === 'keydown' || event.data.type === 'keyup')) {
                showDebug(`RCV: ${event.data.type} ${event.data.keyCode}`);
                
                const canvas = document.querySelector('canvas');
                const target = canvas || window;

                const eventData = {
                    keyCode: event.data.keyCode,
                    which: event.data.keyCode,
                    code: event.data.code,
                    key: event.data.key,
                    bubbles: true,
                    cancelable: true,
                    view: window
                };

                // 1. Try native emulator API if available
                if (window.emulator && typeof window.emulator[event.data.type] === 'function') {
                    try {
                        window.emulator[event.data.type](eventData);
                    } catch (e) {
                        console.error('Native RVM injection failed:', e);
                    }
                }

                // 2. Fallback/Parallel: Dispatch standard DOM event
                const keyEvent = new KeyboardEvent(event.data.type, eventData);
                if (canvas) {
                    if (canvas.getAttribute('tabindex') === null) {
                        canvas.setAttribute('tabindex', '0');
                    }
                    canvas.focus();
                }
                target.dispatchEvent(keyEvent);
            }
        });

        // Ensure canvas gets focus on touch/click directly
        window.addEventListener('load', () => {
            const checkCanvas = setInterval(() => {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    // Force the canvas to be focusable
                    if (canvas.getAttribute('tabindex') === null) {
                        canvas.setAttribute('tabindex', '0');
                    }
                    canvas.addEventListener('pointerdown', () => canvas.focus());
                    clearInterval(checkCanvas);
                }
            }, 500);
        });
    </script>
</body>
</html>
