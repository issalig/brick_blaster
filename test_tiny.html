<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Blaster - tiny8bit Test</title>
    <link rel="stylesheet" href="style.css">
    <script src="assets/i18n.js"></script>
</head>

<body>
    <div class="starfield" id="starfield"></div>

    <div class="container">
        <div class="lang-switcher">
            <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
            <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" data-lang="fr" onclick="setLanguage('fr')">FR</button>
            <button class="lang-btn" data-lang="gr" onclick="setLanguage('gr')">GR</button>
            <button class="lang-btn" data-lang="va" onclick="setLanguage('va')">VA</button>
            <button class="lang-btn" data-lang="pt" onclick="setLanguage('pt')">PT</button>
        </div>

        <header>
            <h1 data-i18n="title">Brick Blaster</h1>
            <p class="subtitle" style="color: #00ff00;">(TINY8BIT TEST VERSION)</p>
            <p class="subtitle" data-i18n="subtitle">VESPA RECOVERY MISSION</p>
        </header>

        <main class="emulator-wrapper">
            <iframe id="emulator-frame" src="about:blank" frameborder="0" scrolling="no" allow="autoplay"></iframe>
        </main>

        <section class="info-panels">
            <div class="panel">
                <h3 data-i18n="controls">CONTROLS</h3>
                <ul class="controls-list">
                    <li>
                        <span data-i18n="moveLeft">Move Left</span>
                        <div class="key-container">
                            <button class="key" data-key="79">O</button>
                            <button class="key" data-key="37">&larr;</button>
                        </div>
                    </li>
                    <li>
                        <span data-i18n="moveRight">Move Right</span>
                        <div class="key-container">
                            <button class="key" data-key="80">P</button>
                            <button class="key" data-key="39">&rarr;</button>
                        </div>
                    </li>
                    <li>
                        <span data-i18n="menuNav">Menu Nav</span>
                        <div class="key-container">
                            <button class="key" data-key="38">&uarr;</button>
                            <button class="key" data-key="40">&darr;</button>
                        </div>
                    </li>
                    <li>
                        <span data-i18n="difficultyAdj">Difficulty Adj</span>
                        <div class="key-container">
                            <button class="key" data-key="37">&larr;</button>
                            <button class="key" data-key="39">&rarr;</button>
                        </div>
                    </li>
                    <li>
                        <span data-i18n="fire">Fire / Action</span>
                        <div class="key-container">
                            <button class="key" data-key="32">SPACE</button>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="panel">
                <h3 data-i18n="storyTitle">STORY</h3>
                <p data-i18n="story1" style="line-height: 1.6; color: var(--text-secondary); margin-bottom: 1rem;">
                    It was a normal morning. You went for bread, but <strong>Martin the Martian</strong> stole your
                    scooter.
                </p>
            </div>
        </section>

        <footer class="credits-footer">
            <span>EXPERIMENTAL TINY8BIT VERSION</span>
            <span class="dot">•</span>
            <span data-i18n="creditsYear">2026</span>
        </footer>
    </div>

    <!-- Mobile Gamepad -->
    <div class="mobile-controls" id="mobile-gamepad">
        <div class="gamepad-group d-pad">
            <div class="d-pad-row row-up">
                <button class="gamepad-btn up" data-key="38">
                    <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </button>
            </div>
            <div class="d-pad-row row-middle">
                <button class="gamepad-btn left" data-key="37">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <button class="gamepad-btn right" data-key="39">
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>
            <div class="d-pad-row row-down">
                <button class="gamepad-btn down" data-key="40">
                    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
                </button>
            </div>
        </div>
        <div class="gamepad-group">
            <button class="gamepad-btn fire" data-key="32">
                FIRE
            </button>
        </div>
    </div>

    <script>
        const starfield = document.getElementById('starfield');
        const starCount = 150;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = Math.random() * 50 + 50 + 's';
            star.style.opacity = Math.random();
            star.style.animationDelay = -Math.random() * 100 + 's';
            starfield.appendChild(star);
        }

        // Override original setLanguage to point to our new emulator
        const originalSetLanguage = window.setLanguage;
        window.setLanguage = function (lang) {
            // First run the original translation and state logic
            if (originalSetLanguage) {
                originalSetLanguage(lang);
            }

            // Map our DSK files
            const dskMap = {
                'es': 'assets/disks/brickb_es.dsk',
                'en': 'assets/disks/brickb_en.dsk',
                'fr': 'assets/disks/brickb_fr.dsk',
                'gr': 'assets/disks/brickb_gr.dsk',
                'va': 'assets/disks/brickb_va.dsk',
                'pt': 'assets/disks/brickb_pt.dsk'
            };

            const dsk = dskMap[lang] || dskMap['en'];
            const relDsk = '../' + dsk;
            // Verified: \n works for execution. Using direct run of binary.
            const bootCommand = 'RUN"DISC\n';
            const encodedCommand = encodeURIComponent(bootCommand);

            const frame = document.getElementById('emulator-frame');
            frame.src = `tiny8bit/cpc.html?file=${relDsk}&input=${encodedCommand}`;
        };

        // Mobile Gamepad Logic
        function sendKey(code, type) {
            const frame = document.getElementById('emulator-frame');
            if (!frame || !frame.contentWindow) return;
            
            // Use postMessage to avoid SecurityError (CORS) on file:///
            frame.contentWindow.postMessage({
                type: type,
                keyCode: code,
                code: getKeyCodeString(code),
                key: getKeyString(code)
            }, '*');
        }

        function getKeyString(code) {
            switch(code) {
                case 37: return 'ArrowLeft';
                case 38: return 'ArrowUp';
                case 39: return 'ArrowRight';
                case 40: return 'ArrowDown';
                case 32: return ' ';
                case 79: return 'o';
                case 80: return 'p';
                case 27: return 'Escape';
                case 77: return 'm';
                default: return '';
            }
        }

        function getKeyCodeString(code) {
            switch(code) {
                case 37: return 'ArrowLeft';
                case 38: return 'ArrowUp';
                case 39: return 'ArrowRight';
                case 40: return 'ArrowDown';
                case 32: return 'Space';
                case 79: return 'KeyO';
                case 80: return 'KeyP';
                default: return '';
            }
        }

        const activeKeys = new Set();
        
        function handleGamepadTouch(code, isStart) {
            if (isStart) {
                if (!activeKeys.has(code)) {
                    activeKeys.add(code);
                    sendKey(code, 'keydown');
                }
            } else {
                if (activeKeys.has(code)) {
                    activeKeys.delete(code);
                    sendKey(code, 'keyup');
                }
            }
        }

        document.querySelectorAll('.key, .gamepad-btn').forEach(el => {
            const code = parseInt(el.getAttribute('data-key'));
            if (!code) return;

            const startAction = (e) => {
                if (e.cancelable) e.preventDefault();
                el.classList.add('active');
                handleGamepadTouch(code, true);
            };

            const endAction = (e) => {
                if (e.cancelable) e.preventDefault();
                el.classList.remove('active');
                handleGamepadTouch(code, false);
            };

            el.addEventListener('pointerdown', startAction);
            el.addEventListener('pointerup', endAction);
            el.addEventListener('pointerleave', endAction);
            el.addEventListener('pointercancel', endAction);
            
            el.style.touchAction = 'none';
        });

        // Note: i18n.js already calls setLanguage on DOMContentLoaded
        // so we don't need a redundant window.onload here.
    </script>
</body>

</html>
